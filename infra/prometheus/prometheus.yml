global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'telegram-hosting'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API service metrics
  - job_name: 'hosting-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'api'
    scrape_interval: 10s

  # Dashboard service metrics
  - job_name: 'hosting-dashboard'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['dashboard:8080']
        labels:
          service: 'dashboard'
    scrape_interval: 10s

  # Worker metrics
  - job_name: 'hosting-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8001']
        labels:
          service: 'worker'
    scrape_interval: 30s

  # Scheduler metrics
  - job_name: 'hosting-scheduler'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['scheduler:8002']
        labels:
          service: 'scheduler'
    scrape_interval: 30s

  # PostgreSQL metrics (via postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
    scrape_interval: 30s

  # Redis metrics (via redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
    scrape_interval: 30s

  # Node metrics (via node_exporter)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
    scrape_interval: 30s

  # Nginx metrics (via nginx-prometheus-exporter)
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
    scrape_interval: 30s

  # Cadvisor for container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'
    scrape_interval: 30s